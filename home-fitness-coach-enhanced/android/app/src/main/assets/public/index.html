<!doctype html>
<html lang="en" class="theme-daylight">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="APEX PULSE — Elite Fitness & Biomechanics: Workouts, Training Analytics, and Movement Coaching."
    />
    <meta name="theme-color" content="#f4f4f7" />
    <meta name="color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/app-logo.jpg" />

    <!--
      Theme bootstrap. Follows the device's light/dark setting unless overridden in Settings.
    -->
    <script>
      (function () {
        try {
          var mode = localStorage.getItem("hfc_theme_mode") || "system";
          var dark = mode === "dark" ||
            (mode === "system" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
          var theme = dark ? "obsidian" : "daylight";
          var root = document.documentElement;
          root.classList.remove("theme-obsidian", "theme-daylight");
          root.classList.add("theme-" + theme);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", dark ? "#0a0a0c" : "#f4f4f7");
        } catch (e) {
          /* storage disabled */
        }
      })();
    </script>

    <!--
      Display face only. Every element that uses Unbounded also carries a
      system fallback, so the app renders correctly offline and on first
      paint. The body/UI face is the platform's own by design — see
      --font-ui in styles/tokens.css.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Loaded without blocking the first paint: a normal stylesheet link makes the whole app wait for Google's
         font server, which on a slow mobile connection is seconds of blank screen. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800;900&family=Dancing+Script:wght@500;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />

    <title>APEX PULSE — Elite AI Fitness & Beast Arena</title>
    <script type="module" crossorigin src="/assets/index-C9hzOFip.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-y319qvuB.css">
  </head>
  <body>
    <!-- Shown the instant the app opens, while the code loads. React replaces it. -->
    <style>
      #boot{position:fixed;inset:0;display:grid;place-items:center;background:#f4f4f7;color:#0a0a0c;font:800 15px/1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:.18em}
      .theme-obsidian #boot{background:#0a0a0c;color:#f3f6fb}
      #boot img{width:72px;height:72px;border-radius:18px;display:block;margin:0 auto 14px}
      #boot i{display:block;width:120px;height:3px;margin:16px auto 0;border-radius:3px;background:rgba(127,127,127,.25);overflow:hidden}
      #boot i::after{content:"";display:block;width:40%;height:100%;border-radius:3px;background:#7aa2ff;animation:boot 1s ease-in-out infinite alternate}
      @keyframes boot{from{transform:translateX(-20%)}to{transform:translateX(170%)}}
      @media (prefers-reduced-motion:reduce){#boot i::after{animation:none}}
    </style>
    <div id="root"><div id="boot" role="status" aria-label="Loading Apex Pulse"><div><img src="/app-logo.jpg" alt="" />APEX PULSE<i></i></div></div></div>
  </body>
</html>
